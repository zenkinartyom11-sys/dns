name: Auto Update Game Config (Supercell DNS)
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'   # каждые 3 часа (сдвиг с парсером подписок в wpn)
  workflow_dispatch:
    inputs:
      force_replace:
        description: 'Принудительно заменить серверы (если на телефоне не работает, а чекер пишет "жив")'
        type: boolean
        default: false

concurrency:
  group: game-config
  cancel-in-progress: true

jobs:
  game-config:
    name: Check & replace game servers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Python + зависимости
        run: pip install requests pysocks

      - name: 3. Устанавливаем xray (во /tmp — чтобы НЕ коммитить бинарники в репо)
        run: |
          for i in 1 2 3; do
            curl -sfL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip && break
            echo "retry $i..."; sleep 3
          done
          unzip -o /tmp/xray.zip -d /tmp/xraybin xray
          chmod +x /tmp/xraybin/xray
          /tmp/xraybin/xray version

      - name: 4. Проверка и замена серверов в game_config.json
        run: python game_checker.py
        env:
          XRAY_PATH: /tmp/xraybin/xray
          FORCE_REPLACE: ${{ inputs.force_replace == true && '1' || '0' }}
          MAX_CANDIDATES: ${{ inputs.force_replace == true && '16' || '6' }}

      - name: 5. Отчёт прогона в лог
        run: |
          echo "========== game_report.txt =========="
          cat game_report.txt || echo "(отчёта нет)"

      - name: 6. Коммит и пуш
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "🎮 Game config: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main || true
            git push origin main
          fi
